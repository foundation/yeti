<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Divider fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Divider</h1>
		<div id="stage">
			<h2 class="divider" id="center">Mains</h2>
			<p class="divider" id="start" data-align="start">Starters</p>
			<p class="divider" id="end" data-align="end">Sides</p>
			<p class="divider" id="gapped" data-gap="xl"><span id="gapped-text">Wide</span></p>
			<h2 class="divider" id="long"><span id="long-text">A heading long enough to wrap onto more than one line in a narrow column, and then some more words</span></h2>
		</div>
	</main>
</body>
</html>
