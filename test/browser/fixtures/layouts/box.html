<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Box fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Box</h1>
		<div id="stage">
			<div class="box" id="box" style="background: var(--yeti-color-primary-soft)"><p>Padded</p></div>
			<div class="box" id="bordered" data-border data-gap="lg" style="background: var(--yeti-color-primary-soft)"><p>Padded and bordered</p></div>
			<div class="box" id="plain"><p>No surface at all</p></div>
			<div class="box" id="base-surface" data-surface="base"><p>Base surface</p></div>
			<div class="box" id="raised" data-surface="raised"><p>Raised surface</p></div>
			<div class="box" id="sunken" data-surface="sunken"><p>Sunken surface</p></div>
			<div class="box" id="forced" data-surface="raised" style="color-scheme: dark"><p>A surface in a forced scheme</p><p id="forced-text" style="color: var(--yeti-color-text)">Its page text</p></div>
			<div data-paint="primary"><div class="box" id="on-paint" data-surface="raised"><p>A surface on paint</p></div></div>
			<div class="box" id="axes" data-gap="sm" data-gap-inline="xl" style="background: var(--yeti-color-primary-soft)"><p>Small top and bottom, wide at the sides</p></div>
			<div class="box" id="block-only" data-gap-block="lg" style="background: var(--yeti-color-primary-soft)"><p>Large top and bottom, default sides</p></div>
		</div>
	</main>
</body>
</html>
