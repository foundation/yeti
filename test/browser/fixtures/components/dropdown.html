<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dropdown fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<script type="module" src="../../../../src/components/dropdown/hover.js"></script>
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Dropdown component</h1>
		<div id="stage">
			<div class="dropdown" id="first">
				<button class="button" type="button" popovertarget="menu-one" id="trigger-one" data-emphasis="medium" data-contrast>Account</button>
				<div id="menu-one" popover>
					<a href="#" id="item-one">Profile</a>
					<a href="#">Settings</a>
					<button type="button">Sign out</button>
				</div>
			</div>
			<div class="dropdown" id="second" data-side="end">
				<button class="button" type="button" popovertarget="menu-two" id="trigger-two" data-emphasis="medium">More</button>
				<div id="menu-two" popover>
					<a href="#" id="item-two">Duplicate</a>
					<button type="button">Archive</button>
				</div>
			</div>
			<div class="dropdown" id="third" data-trigger="hover">
				<button class="button" type="button" popovertarget="menu-three" id="trigger-three" data-emphasis="medium">Help</button>
				<div id="menu-three" popover>
					<a href="#" id="item-three">Docs</a>
					<button type="button">Contact</button>
				</div>
			</div>
			<ul role="list" id="tree-list">
				<li class="dropdown" id="tree">
					<a href="#" id="tree-link">Tree</a>
					<button type="button" popovertarget="tree-menu" id="tree-toggle" aria-label="Tree pages"></button>
					<ul id="tree-menu" popover role="list">
						<li><a href="#" id="tree-plain">Plain page</a></li>
						<li class="dropdown" id="sub">
							<a href="#" id="sub-link">Sub</a>
							<button type="button" popovertarget="sub-menu" id="sub-toggle" aria-label="Sub pages"></button>
							<ul id="sub-menu" popover role="list">
								<li><a href="#" id="leaf">Leaf</a></li>
							</ul>
						</li>
						<li class="dropdown" id="lab">
							<button type="button" popovertarget="lab-menu" id="lab-trigger">Label</button>
							<ul id="lab-menu" popover role="list">
								<li><a href="#" id="lab-leaf">Label leaf</a></li>
							</ul>
						</li>
					</ul>
				</li>
			</ul>
			<ul role="list" id="h-tree-list" style="margin-inline-start: 120px; margin-block-start: 80px;">
				<li class="dropdown" id="h-tree" data-trigger="hover">
					<a href="#" id="h-tree-link">Tree</a>
					<button type="button" popovertarget="h-tree-menu" id="h-tree-toggle" aria-label="Hover top toggle"></button>
					<ul id="h-tree-menu" popover role="list">
						<li><a href="#" id="h-tree-plain">Plain page</a></li>
						<li class="dropdown" id="h-sub">
							<a href="#" id="h-sub-link">Sub</a>
							<button type="button" popovertarget="h-sub-menu" id="h-sub-toggle" aria-label="Hover inner toggle"></button>
							<ul id="h-sub-menu" popover role="list">
								<li><a href="#" id="h-leaf">Leaf</a></li>
							</ul>
						</li>
						<li class="dropdown" id="h-lab">
							<button type="button" popovertarget="h-lab-menu" id="h-lab-trigger">Label</button>
							<ul id="h-lab-menu" popover role="list">
								<li><a href="#" id="h-lab-leaf">Label leaf</a></li>
							</ul>
						</li>
					</ul>
				</li>
			</ul>
		</div>
	</main>
</body>
</html>
