<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Share button fixture</title>
	<link rel="canonical" href="https://example.com/canonical-page">
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<script type="module" src="../../../../src/components/button/button.js"></script>
</head>
<body>
	<main>
		<h1>Share button</h1>
		<div class="stack" data-gap="sm">
			<div class="cluster" data-gap="sm">
				<button class="button" type="button" id="plain" data-action="share">Share</button>
				<button class="button" type="button" id="labelled" data-action="share" data-done="Link copied" aria-live="polite">Share this page</button>
				<button class="button" type="button" id="inert" data-action="share" data-done="Link copied" aria-disabled="true">Share</button>
			</div>
			<p><a id="article" href="/articles/one">  Article one </a></p>
			<p id="prose">A paragraph, which is not a link.</p>
			<div class="cluster" data-gap="sm">
				<button class="button" type="button" id="link" data-action="share" data-target="article" data-done="Link copied" aria-live="polite">Share the article</button>
				<button class="button" type="button" id="missing" data-action="share" data-target="nowhere" data-done="Link copied">Share nothing</button>
				<button class="button" type="button" id="not-a-link" data-action="share" data-target="prose" data-done="Link copied">Share a paragraph</button>
			</div>
		</div>
	</main>
</body>
</html>
