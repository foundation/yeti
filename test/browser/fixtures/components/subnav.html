<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Subnav fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Subnav component</h1>
		<div id="stage">
			<nav class="subnav" aria-label="Section" id="sn">
				<ul role="list">
					<li><a href="#overview" id="sn-plain">Overview</a></li>
					<li id="sn-parent">
						<a href="#layouts" id="sn-parent-link">Layouts</a>
						<details open id="sn-details">
							<summary aria-label="Layouts pages" id="sn-summary"></summary>
							<ul role="list">
								<li><a href="#stack" aria-current="page" id="sn-leaf">Stack</a></li>
								<li><a href="#grid">Grid</a></li>
							</ul>
						</details>
					</li>
					<li id="sn-closed">
						<a href="#tokens" id="sn-closed-link">Tokens</a>
						<details id="sn-closed-details">
							<summary aria-label="Tokens pages" id="sn-closed-summary"></summary>
							<ul role="list">
								<li><a href="#colors" id="sn-hidden">Colors</a></li>
							</ul>
						</details>
					</li>
					<li id="sn-nolink">
						<details>
							<summary id="sn-nolink-summary">Reference</summary>
							<ul role="list">
								<li><a href="#glossary">Glossary</a></li>
							</ul>
						</details>
					</li>
				</ul>
			</nav>
		</div>
	</main>
</body>
</html>
