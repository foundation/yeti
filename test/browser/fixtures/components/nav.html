<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nav fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Nav component</h1>
		<div id="stage">
			<nav class="nav" id="nav" aria-label="Site">
				<a href="#" data-brand id="brand">Yeti</a>
				<button type="button" popovertarget="menu" aria-label="Menu" id="toggle">☰</button>
				<ul id="menu" popover role="list">
					<li><a href="#" id="current" aria-current="page" data-contrast>Docs</a></li>
					<li><a href="#" id="plain" data-contrast>Blog</a></li>
					<li><a href="#about">About</a></li>
					<li id="has-dropdown">
						<div class="dropdown">
							<button type="button" popovertarget="nav-more" id="nav-more-trigger">More</button>
							<div id="nav-more" popover>
								<a href="#" id="nav-more-first">Changelog</a>
								<a href="#">Status</a>
							</div>
						</div>
					</li>
					<li class="dropdown" id="nav-li">
						<button type="button" popovertarget="nav-li-menu" id="nav-li-trigger">Guides</button>
						<div id="nav-li-menu" popover>
							<a href="#" id="nav-li-first">Start</a>
						</div>
					</li>
				</ul>
				<div data-actions id="actions"><a class="button" href="#" data-size="sm" data-contrast>Get started</a></div>
			</nav>
			<nav class="nav" id="drawer-nav" aria-label="Drawer" data-panel="drawer">
				<a href="#" data-brand>Yeti</a>
				<button type="button" popovertarget="drawer-menu" aria-label="Menu" id="drawer-toggle">☰</button>
				<ul id="drawer-menu" popover role="list">
					<li data-close id="drawer-close"><button type="button" popovertarget="drawer-menu" popovertargetaction="hide" aria-label="Close">×</button></li>
					<li><a href="#" id="drawer-first">Docs</a></li>
					<li><a href="#">Blog</a></li>
					<li id="drawer-has-dropdown">
						<div class="dropdown">
							<button type="button" popovertarget="drawer-more" id="drawer-more-trigger">More</button>
							<div id="drawer-more" popover>
								<a href="#" id="drawer-more-first">Changelog</a>
								<a href="#">Status</a>
							</div>
						</div>
					</li>
				</ul>
			</nav>
			<nav class="nav" id="screen-nav" aria-label="Screen" data-panel="screen">
				<a href="#" data-brand>Yeti</a>
				<button type="button" popovertarget="screen-menu" aria-label="Menu" id="screen-toggle">☰</button>
				<ul id="screen-menu" popover role="list">
					<li data-close id="screen-close"><button type="button" popovertarget="screen-menu" popovertargetaction="hide" aria-label="Close">×</button></li>
					<li><a href="#">Docs</a></li>
					<li><a href="#">Blog</a></li>
				</ul>
			</nav>
			<nav class="nav" data-paint="primary" id="painted" aria-label="Painted">
				<a href="#" data-brand>Yeti</a>
				<button type="button" popovertarget="painted-menu" aria-label="Menu">☰</button>
				<ul id="painted-menu" popover role="list">
					<li><a href="#" id="painted-link">Docs</a></li>
					<li>
						<div class="dropdown">
							<button type="button" popovertarget="painted-more" id="painted-trigger">More</button>
							<div id="painted-more" popover>
								<a href="#">Changelog</a>
								<a href="#">Status</a>
							</div>
						</div>
					</li>
				</ul>
			</nav>
			<nav class="nav" id="nt" data-panel="drawer" aria-label="Tree">
				<button type="button" popovertarget="nt-menu" aria-label="Menu" id="nt-toggle">☰</button>
				<ul id="nt-menu" popover role="list">
					<li><a href="#" id="nt-home">Home</a></li>
					<li class="dropdown" id="nt-about">
						<a href="#" id="nt-about-link">About</a>
						<button type="button" popovertarget="nt-about-menu" id="nt-about-toggle" aria-label="About pages"></button>
						<ul id="nt-about-menu" popover role="list">
							<li><a href="#" id="nt-history">History</a></li>
						</ul>
					</li>
					<li class="dropdown" id="nt-team">
						<a href="#" id="nt-team-link">Team</a>
						<button type="button" popovertarget="nt-team-menu" id="nt-team-toggle" aria-label="Team pages"></button>
						<ul id="nt-team-menu" popover role="list">
							<li><a href="#" id="nt-leaf" aria-current="page">Leaf</a></li>
						</ul>
					</li>
					<li class="dropdown" id="nt-lab">
						<button type="button" popovertarget="nt-lab-menu" id="nt-lab-trigger">More</button>
						<ul id="nt-lab-menu" popover role="list">
							<li><a href="#" id="nt-lab-leaf">Lab leaf</a></li>
						</ul>
					</li>
				</ul>
			</nav>
			<p>Content below the bar.</p>
		</div>
	</main>
</body>
</html>
